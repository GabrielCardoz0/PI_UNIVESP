<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inscrições — Amecomex Admin</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>
  <header>
    <div class="container">
      <a href="/admin" class="brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-name">Amecomex</span>
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-sub">Admin</span>
      </a>
      <nav aria-label="Navegação principal">
        <span id="who" class="text-sm text-muted"></span>
        <a href="/">Página pública</a>
        <button id="btn-logout" class="ghost sm">Sair</button>
      </nav>
    </div>
  </header>

  <main id="main-content" class="wide" tabindex="-1">
    <div class="dashboard-head">
      <div>
        <h1>Inscrições</h1>
        <p>Gerencie as inscrições recebidas. <span id="total-badge" role="status"></span></p>
      </div>
      <button class="primary" id="btn-novo">+ Nova inscrição</button>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <label for="q" class="sr-only">Buscar inscrições</label>
        <input type="search" id="q" placeholder="Buscar por nome, e-mail, CPF ou cidade…" autocomplete="off" />
      </div>
    </div>

    <div id="msg" class="message-region"></div>

    <div id="lista" aria-busy="true"></div>
  </main>

  <dialog class="modal" id="modal" aria-labelledby="modal-title" aria-describedby="modal-description">
      <div class="modal-header">
        <h2 id="modal-title">Nova inscrição</h2>
        <p id="modal-description">Preencha os dados abaixo. Campos marcados com <span aria-hidden="true">*</span> são obrigatórios.</p>
      </div>
      <div class="modal-body">
        <div id="modal-msg" class="message-region"></div>
        <div id="modal-timestamps" class="text-xs text-muted" style="display:none; margin-bottom: 16px; padding: 10px 12px; background: hsl(var(--muted)); border-radius: calc(var(--radius) - 2px); display:none;"></div>
        <form id="form-admin" novalidate>
          <input type="hidden" name="id" />

          <div class="field">
            <label for="admin-nomeCompleto">Nome Completo <span class="req" aria-hidden="true">*</span></label>
            <input id="admin-nomeCompleto" type="text" name="nomeCompleto" autocomplete="name" required />
          </div>

          <div class="row">
            <div class="field">
              <label for="admin-comoPrefereChamada">Como prefere ser chamada? <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-comoPrefereChamada" type="text" name="comoPrefereChamada" required />
            </div>
            <div class="field">
              <label for="admin-dataNascimento">Data de Nascimento <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-dataNascimento" type="date" name="dataNascimento" autocomplete="bday" min="1900-01-01" required />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="admin-email">E-mail <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-email" type="email" name="email" autocomplete="email" pattern="[^\s@]+@[^\s@]+\.[A-Za-z]{2,63}" required />
            </div>
            <div class="field">
              <label for="admin-celular">Celular / WhatsApp <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-celular" type="tel" name="celular" autocomplete="tel" inputmode="tel" required />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="admin-rg">RG <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-rg" type="text" name="rg" autocomplete="off" required />
            </div>
            <div class="field">
              <label for="admin-cpf">CPF <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-cpf" type="text" name="cpf" autocomplete="off" inputmode="numeric" required />
            </div>
          </div>

          <div class="row">
            <div class="field field-cep">
              <label for="admin-cep">CEP <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-cep" type="text" name="cep" autocomplete="postal-code" inputmode="numeric" aria-describedby="admin-cep-status" required />
              <span id="admin-cep-status" class="field-hint" data-cep-status role="status"></span>
            </div>
            <div class="field">
              <label for="admin-numero">Número <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-numero" type="text" name="numero" autocomplete="address-line2" inputmode="numeric" pattern="[0-9]+" maxlength="20" required />
            </div>
          </div>

          <div class="field">
            <label for="admin-logradouro">Logradouro <span class="req" aria-hidden="true">*</span></label>
            <input id="admin-logradouro" type="text" name="logradouro" autocomplete="address-line1" required />
          </div>

          <div class="row">
            <div class="field">
              <label for="admin-complemento">Complemento</label>
              <input id="admin-complemento" type="text" name="complemento" autocomplete="address-line3" />
            </div>
            <div class="field">
              <label for="admin-bairro">Bairro <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-bairro" type="text" name="bairro" autocomplete="address-level3" required />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="admin-cidade">Cidade <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-cidade" type="text" name="cidade" autocomplete="address-level2" required />
            </div>
            <div class="field">
              <label for="admin-estado">Estado <span class="req" aria-hidden="true">*</span></label>
              <select id="admin-estado" name="estado" autocomplete="address-level1" required>
                <option value="">Selecione…</option>
                <option value="AC">Acre (AC)</option>
                <option value="AL">Alagoas (AL)</option>
                <option value="AP">Amapá (AP)</option>
                <option value="AM">Amazonas (AM)</option>
                <option value="BA">Bahia (BA)</option>
                <option value="CE">Ceará (CE)</option>
                <option value="DF">Distrito Federal (DF)</option>
                <option value="ES">Espírito Santo (ES)</option>
                <option value="GO">Goiás (GO)</option>
                <option value="MA">Maranhão (MA)</option>
                <option value="MT">Mato Grosso (MT)</option>
                <option value="MS">Mato Grosso do Sul (MS)</option>
                <option value="MG">Minas Gerais (MG)</option>
                <option value="PA">Pará (PA)</option>
                <option value="PB">Paraíba (PB)</option>
                <option value="PR">Paraná (PR)</option>
                <option value="PE">Pernambuco (PE)</option>
                <option value="PI">Piauí (PI)</option>
                <option value="RJ">Rio de Janeiro (RJ)</option>
                <option value="RN">Rio Grande do Norte (RN)</option>
                <option value="RS">Rio Grande do Sul (RS)</option>
                <option value="RO">Rondônia (RO)</option>
                <option value="RR">Roraima (RR)</option>
                <option value="SC">Santa Catarina (SC)</option>
                <option value="SP">São Paulo (SP)</option>
                <option value="SE">Sergipe (SE)</option>
                <option value="TO">Tocantins (TO)</option>
                <option value="EX">Não moro no Brasil</option>
              </select>
            </div>
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="outline" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="primary" id="btn-salvar" form="form-admin">Salvar</button>
      </div>
  </dialog>

  <script src="/masks.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
